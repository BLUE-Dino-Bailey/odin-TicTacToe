<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="css/style.css" rel="stylesheet">
    <script src="javascript/javascript.js" defer></script>
    <title>Odin-TicTacToe</title>
</head>
<body>
    <nav>
        <div>
            <h1 class="heading">Tic Tac Toe</h1>
        </div>
        <div>
            <button id="new-game">New Game</button>
        </div>
    </nav>
    <div class="main-container">
        <div class="gameboard">
            <div class="box" id="1">X</div>
            <div class="box" id="2">O</div>
            <div class="box" id="3">X</div>
            <div class="box" id="4">O</div>
            <div class="box" id="5">X</div>
            <div class="box" id="6">O</div>
            <div class="box" id="7">X</div>
            <div class="box" id="8">O</div>
            <div class="box" id="9">X</div>
        </div>
    </div>
</body>
</html>
